name: Build ParcelGuard APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/admin-dashboard-v0.7, feature/license-after-sales-v0.7.1]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22 for license tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lifetime license package logic
        run: node --test functions/test/license-model.test.js
      - name: Syntax-check Admin server, owner grant and web app
        run: |
          node --check functions/index.js
          node --check functions/admin-functions.js
          node --check functions/scripts/grant-admin.js
          node --check admin-web/app.js
          node --check admin-web/firebase-config.js
          node scripts/verify-admin-ui.js
          node -e "const f=require('fs');const v=JSON.parse(f.readFileSync('firebase.json','utf8'));if(v.hosting.public!=='admin-web')process.exit(1)"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify carrier-specific tracking selection
        run: |
          mkdir -p /tmp/pg-barcode-check
          javac -d /tmp/pg-barcode-check app/src/main/java/com/parcelguard/offline/TrackingSelector.java app/src/test/java/com/parcelguard/offline/TrackingSelectorSmokeTest.java
          java -cp /tmp/pg-barcode-check com.parcelguard.offline.TrackingSelectorSmokeTest
      - name: Verify A4 manifest pagination
        run: |
          mkdir -p /tmp/pg-manifest-check
          javac -d /tmp/pg-manifest-check app/src/main/java/com/parcelguard/offline/BagManifestPages.java app/src/test/java/com/parcelguard/offline/BagManifestPagesSmokeTest.java
          java -cp /tmp/pg-manifest-check com.parcelguard.offline.BagManifestPagesSmokeTest
      - name: Verify scale OCR parsing and stability
        run: |
          mkdir -p /tmp/pg-weight-check
          javac -d /tmp/pg-weight-check app/src/main/java/com/parcelguard/offline/ScaleWeightParser.java app/src/test/java/com/parcelguard/offline/ScaleWeightParserSmokeTest.java
          java -cp /tmp/pg-weight-check com.parcelguard.offline.ScaleWeightParserSmokeTest
      - name: Verify multi-bag manifest page coverage
        run: |
          mkdir -p /tmp/pg-multi-bag-check
          javac -d /tmp/pg-multi-bag-check app/src/main/java/com/parcelguard/offline/BagManifestPages.java app/src/main/java/com/parcelguard/offline/BatchManifestPlan.java app/src/test/java/com/parcelguard/offline/BatchManifestPlanSmokeTest.java
          java -cp /tmp/pg-multi-bag-check com.parcelguard.offline.BatchManifestPlanSmokeTest
      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParcelGuard-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
