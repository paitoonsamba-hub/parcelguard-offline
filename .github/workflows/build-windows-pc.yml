name: Build ParcelGuard PC V0.8
on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-pro-license-v0.8
      - feature/qr-renewal-v0.8.4
      - fix/qr-sync-monitor-v0.8.5
jobs:
  verify-and-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows source and unit tests
        shell: pwsh
        run: |
          python -m compileall -q windows-receiver
          python -m unittest discover -s windows-receiver -p 'test_*.py' -v
      - name: Install Windows app bundling requirements
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 qrcode==8.2 pillow==11.3.0
      - name: Bundle standalone Windows app
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name ParcelGuardPC --paths windows-receiver windows-receiver/main.py
          if (-not (Test-Path "dist/ParcelGuardPC.exe")) { throw "Missing ParcelGuardPC.exe" }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ParcelGuard-PC-V080-Windows
          path: dist/ParcelGuardPC.exe
          if-no-files-found: error
          retention-days: 14
